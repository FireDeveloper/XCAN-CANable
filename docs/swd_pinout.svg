<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" font-family="Helvetica, Arial, sans-serif">
  <title>SWD header pinout, top view: pin 1 Vcc (square pad), pin 2 SWDIO, pin 3 SWCLK, pin 4 GND</title>
  <rect x="10" y="10" width="540" height="230" rx="18" fill="#1c1c1c" stroke="#3c3c3c" stroke-width="2"/>
  <text x="280" y="46" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle">SWD header (top view)</text>

  <rect x="102" y="88" width="56" height="56" rx="3" fill="#cfcfcf"/>
  <circle cx="130" cy="116" r="11" fill="#1c1c1c"/>
  <circle cx="230" cy="116" r="28" fill="#cfcfcf"/>
  <circle cx="230" cy="116" r="11" fill="#1c1c1c"/>
  <circle cx="330" cy="116" r="28" fill="#cfcfcf"/>
  <circle cx="330" cy="116" r="11" fill="#1c1c1c"/>
  <circle cx="430" cy="116" r="28" fill="#cfcfcf"/>
  <circle cx="430" cy="116" r="11" fill="#1c1c1c"/>

  <g font-size="15" fill="#bdbdbd" text-anchor="middle">
    <text x="130" y="174">1</text>
    <text x="230" y="174">2</text>
    <text x="330" y="174">3</text>
    <text x="430" y="174">4</text>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="130" y="200" fill="#ff6e6e">Vcc</text>
    <text x="230" y="200" fill="#ffd54f">SWDIO</text>
    <text x="330" y="200" fill="#64b5f6">SWCLK</text>
    <text x="430" y="200" fill="#e0e0e0">GND</text>
  </g>
  <text x="280" y="226" fill="#9e9e9e" font-size="13" text-anchor="middle">Pin 1 is the square pad</text>
</svg>
