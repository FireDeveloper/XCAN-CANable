name: Build XCAN firmware

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ] # a version tag also publishes a release
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned runner image, so a toolchain update never changes a build unannounced

    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: build firmware
        working-directory: src # CMakeLists.txt and its presets live in src/; the images land in src/build/Release/
        run: cmake --preset Release && cmake --build --preset Release

      #? Users set their own USB IDs in the downloaded image with utilities/usb_id.py, which needs the descriptor at its fixed address.
      - name: check the USB descriptor location
        run: >-
          python3 utilities/usb_id.py src/build/Release/xcan_canable.bin
          && python3 utilities/usb_id.py src/build/Release/xcan_canable.hex

      - name: upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xcan_canable
          retention-days: 90 # how long the run keeps the download
          path: |
            src/build/Release/xcan_canable.elf
            src/build/Release/xcan_canable.hex
            src/build/Release/xcan_canable.bin
            utilities/usb_id.py

  #? Branch pushes and pull requests stop at the build artifact; only a version tag (v1.0.0) on a master commit publishes a GitHub Release.
  release:
    if: startsWith( github.ref, 'refs/tags/v' ) # version tags only
    needs: build # publish exactly the images the build job checked
    runs-on: ubuntu-24.04 # same pinned runner image as the build
    permissions:
      contents: write # create the release and attach its files

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every branch and its history, to see whether master contains the tag

      #? Releases come from master only, so a tag on any other commit fails here instead of publishing.
      - name: check the tag is on master
        run: >-
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }

      - name: download firmware
        uses: actions/download-artifact@v4
        with:
          name: xcan_canable
          path: dist # src/build/Release/ and utilities/ land under dist/

      - name: name the files after the tag
        run: |
          for ext in bin hex elf; do mv "dist/src/build/Release/xcan_canable.$ext" "dist/xcan-canable-$GITHUB_REF_NAME.$ext"; done # xcan-canable-v1.0.0.bin and so on
          mv dist/utilities/usb_id.py dist/usb_id.py # the ID tool next to the images

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }} # the job's token, limited by the permissions above
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/xcan-canable-* dist/usb_id.py
          --repo "$GITHUB_REPOSITORY" --title "XCAN firmware $GITHUB_REF_NAME" --generate-notes
